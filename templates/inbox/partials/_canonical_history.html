<div data-canonical-page data-composer-refresh-key="{{ composer_refresh_key }}" data-composer-revision="{{ conversation_composer.composer_revision }}" data-composer-scope-token="{{ conversation_composer.scope_token }}" data-send-allowed="{% if send_availability.allowed %}true{% else %}false{% endif %}" data-send-reason="{{ send_availability.reason }}" data-view-scope="{{ canonical_view_scope }}" data-revision="{{ canonical_conversation.revision }}" data-latest-url="{{ canonical_latest_url }}" data-composer-observation-token="{{ composer_observation_token }}" data-conversation-id="{{ canonical_conversation.id }}" data-older-url="{{ canonical_older_url }}" data-undated-url="{{ canonical_undated_url }}" data-read-ack-token="{{ read_ack_token }}">
<div data-canonical-dated>{% for item in canonical_messages %}{% include "inbox/partials/_canonical_message.html" %}{% endfor %}</div>
<div data-canonical-undated>{% if canonical_undated %}<p class="text-[11px] text-stone-500">Time unavailable</p>{% endif %}{% for item in canonical_undated %}{% include "inbox/partials/_canonical_message.html" %}{% endfor %}</div>
</div>
