<form id="inbox-filters" data-canonical-filters hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}" hx-trigger="inbox:refresh-list" hx-target="#inbox-message-list" hx-sync="#inbox-message-list:queue last" class="p-3 border-b space-y-2">
<input type="hidden" name="read_source" value="canonical"><input type="hidden" name="domain" value="dm"><input type="hidden" name="cursor" data-canonical-list-cursor value="{{ list_cursor }}">
<div class="relative"><input type="text" name="q" value="{{ search_query }}" data-inbox-search aria-label="Search conversations" placeholder="Search conversations..." class="canonical-filter w-full" style="padding-right:32px" hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}" hx-trigger="input changed delay:400ms, inbox:clear-search" hx-target="#inbox-message-list" hx-include="#inbox-filters" hx-push-url="true" hx-sync="#inbox-message-list:queue last"><button type="button" data-inbox-clear-search aria-label="Clear search" title="Clear search" {% if not search_query %}hidden{% endif %} class="absolute right-1 top-1/2 -translate-y-1/2 w-7 h-7"><span aria-hidden="true">×</span></button></div>
<div class="flex flex-wrap gap-2"><select name="platform" data-inbox-platform aria-label="Filter by platform" class="canonical-filter flex-1" hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}" hx-target="#inbox-message-list" hx-include="#inbox-filters" hx-push-url="true" hx-sync="#inbox-message-list:queue last"><option value="">All platforms</option>{% for value,label in platform_choices %}<option value="{{ value }}" {% if value == active_platform %}selected{% endif %}>{{ label }}</option>{% endfor %}</select>
<select name="account" data-inbox-account aria-label="Filter by account" class="canonical-filter flex-1" hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}" hx-target="#inbox-message-list" hx-include="#inbox-filters" hx-push-url="true" hx-sync="#inbox-message-list:queue last"><option value="">All accounts</option>{% for account in canonical_accounts %}<option value="{{ account.id }}" data-platform="{{ account.platform }}" {% if account.id == active_account %}selected{% endif %}>{{ account.account_name }}{% if account.account_handle %} · @{{ account.account_handle }}{% endif %}</option>{% endfor %}</select>
<select name="workflow" aria-label="Filter by conversation status" class="canonical-filter" hx-get="{% url 'inbox:feed' workspace_id=workspace.id %}" hx-target="#inbox-message-list" hx-include="#inbox-filters" hx-push-url="true" hx-sync="#inbox-message-list:queue last"><option value="">All statuses</option><option value="needs_action" {% if active_workflow == 'needs_action' %}selected{% endif %}>待處理</option><option value="waiting" {% if active_workflow == 'waiting' %}selected{% endif %}>等對方</option><option value="done" {% if active_workflow == 'done' %}selected{% endif %}>已完成</option></select></div>{% if legacy_account_sources %}<nav aria-label="Other DM accounts" class="text-sm space-y-1"><p>Other accounts use their existing inbox:</p>{% for account in legacy_account_sources %}<a class="block underline" href="{{ account.inbox_url }}">{{ account.account_name }}{% if account.account_handle %} · @{{ account.account_handle }}{% endif %}</a>{% endfor %}</nav>{% endif %}</form>
